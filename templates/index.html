
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI News Classification</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <h1>AI News Classification</h1>
        <p class="subtitle">Intelligent News Category Prediction</p>

        <div class="input-section">
            <label for="newsText">Enter your news article or sentence</label>

            <textarea
                id="newsText"
                placeholder="Paste your news text here..."
            ></textarea>

            <button id="predictBtn" onclick="predictNews()">
                Predict Category
            </button>
        </div>

        <div id="result" class="result hidden">
            <p>Predicted News Category</p>
            <h2 id="category"></h2>
        </div>

        <p id="error" class="error"></p>

    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
